<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AR Viewer — Museum Virtual</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="css/ar-viewer.css" />
</head>

<body>

  <!-- AR UI -->
  <div id="ar-ui">
    <div id="ar-header">
      <button id="btn-back" onclick="goBack()">← Museum</button>
      <div id="ar-collection-name">Memuat...</div>
    </div>
    <div id="marker-guide">
      <div id="marker-frame">
        <div id="marker-icon">⬛</div>
      </div>
      <p>Arahkan kamera ke<br>marker Hiro</p>
    </div>
    <div id="ar-status">
      <span id="status-dot"></span>
      <span id="status-text">Mencari marker...</span>
    </div>
  </div>

  <!-- Permission Error -->
  <div id="permission-error">
    <h2>Akses Kamera</h2>
    <p>Izinkan akses kamera untuk menggunakan fitur AR.<br>Android: gunakan Chrome &nbsp;|&nbsp; iOS: gunakan Safari.
    </p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>

  <!-- AR SCENE -->
  <a-scene id="ar-scene"
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; facingMode: environment; debugUIEnabled: false; errorPopup: permission-error;"
    vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true;"
    loading-screen="enabled: false">
    <a-assets>
      <a-asset-item id="ar-model-1" src="assets/models/Stag Statue.glb"></a-asset-item>
      <a-asset-item id="ar-model-2" src="assets/models/Statue.glb"></a-asset-item>
      <a-asset-item id="ar-model-3" src="assets/models/MayanTemple.glb"></a-asset-item>
      <img id="ar-p1" src="assets/images/Vincent_van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg"
        crossorigin="anonymous" />
      <img id="ar-p2" src="assets/images/Farmhouse_in_Provence,_1888,_Vincent_van_Gogh,_NGA.jpg"
        crossorigin="anonymous" />
      <img id="ar-p3" src="assets/images/Vincent_van_Gogh_-_Self-Portrait_-_Google_Art_Project_(454045).jpg"
        crossorigin="anonymous" />
      <img id="ar-p4" src="assets/images/Still_Life_with_Yellow_Straw_Hat_-_Vincent_Van_Gogh.jpg"
        crossorigin="anonymous" />
      <img id="ar-p5" src="assets/images/View_of_the_Hague_(Paddemoes)_-_Vincent_Van_Gogh.jpg"
        crossorigin="anonymous" />
      <img id="ar-p6" src="assets/images/Woman_sewing_and_cat_-_Vincent_Van_Gogh.jpg" crossorigin="anonymous" />
    </a-assets>

    <a-marker preset="hiro" id="hiro-marker">

      <!-- Artefak 1: Stag Statue -->
      <a-entity id="ar-artifact-1" visible="false">
        <a-gltf-model src="#ar-model-1" position="0 0.1 0" scale="0.3 0.3 0.3"></a-gltf-model>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.12 0" rotation="-90 0 0"></a-plane>
        <a-text value="Stag Statue" align="center" color="#e8c97a" width="1.3" position="0 -0.11 0" rotation="-90 0 0"
          font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Artefak 2: Classical Statue -->
      <a-entity id="ar-artifact-2" visible="false">
        <a-gltf-model src="#ar-model-2" position="0 0.1 0" scale="0.5 0.5 0.5"></a-gltf-model>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.12 0" rotation="-90 0 0"></a-plane>
        <a-text value="Classical Statue" align="center" color="#e8c97a" width="1.3" position="0 -0.11 0"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Artefak 3: Mayan Temple -->
      <a-entity id="ar-artifact-3" visible="false">
        <a-gltf-model src="#ar-model-3" position="0 0.1 0" scale="0.5 0.5 0.5"></a-gltf-model>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.12 0" rotation="-90 0 0"></a-plane>
        <a-text value="Mayan Temple" align="center" color="#e8c97a" width="1.3" position="0 -0.11 0" rotation="-90 0 0"
          font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 1: Starry Night -->
      <a-entity id="ar-painting-1" visible="false">
        <a-box width="1.5" height="1.22" depth="0.04" color="#3d2b0e" position="0 0.65 -0.03"></a-box>
        <a-plane src="#ar-p1" width="1.4" height="1.1" position="0 0.65 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="The Starry Night" align="center" color="#e8c97a" width="1.3" position="0 0 0.01"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 2: Farmhouse -->
      <a-entity id="ar-painting-2" visible="false">
        <a-box width="1.5" height="1.22" depth="0.04" color="#3d2b0e" position="0 0.65 -0.03"></a-box>
        <a-plane src="#ar-p2" width="1.4" height="1.1" position="0 0.65 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="Farmhouse in Provence" align="center" color="#e8c97a" width="1.3" position="0 0 0.01"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 3: Self-Portrait -->
      <a-entity id="ar-painting-3" visible="false">
        <a-box width="1.1" height="1.42" depth="0.04" color="#3d2b0e" position="0 0.72 -0.03"></a-box>
        <a-plane src="#ar-p3" width="0.9" height="1.2" position="0 0.65 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="Self-Portrait" align="center" color="#e8c97a" width="1.3" position="0 0 0.01" rotation="-90 0 0"
          font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 4: Still Life with Yellow Straw Hat -->
      <a-entity id="ar-painting-4" visible="false">
        <a-box width="1.25" height="1.02" depth="0.04" color="#3d2b0e" position="0 0.52 -0.03"></a-box>
        <a-plane src="#ar-p4" width="1.1" height="0.88" position="0 0.5 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="Still Life with Yellow Straw Hat" align="center" color="#e8c97a" width="1.35" position="0 0 0.01"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 5: View of the Hague -->
      <a-entity id="ar-painting-5" visible="false">
        <a-box width="1.5" height="1.22" depth="0.04" color="#3d2b0e" position="0 0.65 -0.03"></a-box>
        <a-plane src="#ar-p5" width="1.4" height="1.1" position="0 0.65 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="View of the Hague" align="center" color="#e8c97a" width="1.3" position="0 0 0.01"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

      <!-- Lukisan 6: Woman Sewing and Cat -->
      <a-entity id="ar-painting-6" visible="false">
        <a-box width="1.25" height="1.02" depth="0.04" color="#3d2b0e" position="0 0.52 -0.03"></a-box>
        <a-plane src="#ar-p6" width="1.1" height="0.88" position="0 0.5 0.02"></a-plane>
        <a-plane width="1.4" height="0.22" color="#0d0a05" position="0 -0.01 0" rotation="-90 0 0"></a-plane>
        <a-text value="Woman Sewing and Cat" align="center" color="#e8c97a" width="1.35" position="0 0 0.01"
          rotation="-90 0 0" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="js/ar-viewer.js"></script>

</body>

</html>
